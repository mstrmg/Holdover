; Windows-only engine settings. Kept apart from DefaultEngine.ini, which carries a local edit on Miles's PC.

[/Script/Engine.RendererSettings]
; Nanite Foliage, which the Fab Megaplants are built for: voxel shape preservation for far leaves and
; Nanite assemblies (one tree = trunk plus instanced branch meshes). Without them each plant is rebuilt
; as a plain heavy skeletal mesh, which ran the 16 GB PC out of memory.
r.Nanite.AllowVoxels=1
r.Nanite.AllowAssemblies=1
